<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="590" viewBox="0 0 1180 590" role="img" aria-labelledby="title desc">
  <title id="title">DER do sistema Pokédex Arena</title>
  <desc id="desc">Usuarios sem relacionamentos. Treinadores têm vários Pokémons. Pokémons têm várias batalhas.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#747df6"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#202238" flood-opacity=".08"/></filter>
  </defs>
  <rect width="1180" height="590" rx="24" fill="#f7f7fa"/>
  <text x="54" y="58" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#ec5362">POKÉDEX ARENA · MODELO DE DADOS</text>
  <text x="54" y="93" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#171824">Diagrama Entidade-Relacionamento</text>

  <g filter="url(#shadow)">
    <rect x="54" y="144" width="235" height="289" rx="14" fill="#fff" stroke="#ececf1"/>
    <rect x="54" y="144" width="235" height="52" rx="14" fill="#272836"/>
    <path d="M54 180h235v16H54z" fill="#272836"/>
    <text x="76" y="177" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">USUARIOS</text>
    <text x="76" y="229" font-family="Arial,sans-serif" font-size="13" fill="#747585">id <tspan fill="#ec5362" font-weight="700">PK</tspan></text>
    <line x1="76" y1="244" x2="267" y2="244" stroke="#f0f0f4"/>
    <text x="76" y="271" font-family="Arial,sans-serif" font-size="13" fill="#747585">nome <tspan fill="#ec5362" font-weight="700">UNIQUE</tspan></text>
    <line x1="76" y1="286" x2="267" y2="286" stroke="#f0f0f4"/>
    <text x="76" y="313" font-family="Arial,sans-serif" font-size="13" fill="#747585">senha <tspan fill="#9b9baa">VARCHAR(255)</tspan></text>
    <rect x="76" y="346" width="185" height="50" rx="8" fill="#f7f7fc"/>
    <text x="91" y="367" font-family="Arial,sans-serif" font-size="11" fill="#878897">Sem relacionamentos</text>
    <text x="91" y="383" font-family="Arial,sans-serif" font-size="11" fill="#878897">com as demais tabelas</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="375" y="144" width="250" height="289" rx="14" fill="#fff" stroke="#ececf1"/>
    <rect x="375" y="144" width="250" height="52" rx="14" fill="#ec5362"/>
    <path d="M375 180h250v16H375z" fill="#ec5362"/>
    <text x="397" y="177" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">TREINADORES</text>
    <text x="397" y="229" font-family="Arial,sans-serif" font-size="13" fill="#747585">id <tspan fill="#ec5362" font-weight="700">PK</tspan></text>
    <line x1="397" y1="244" x2="603" y2="244" stroke="#f0f0f4"/>
    <text x="397" y="271" font-family="Arial,sans-serif" font-size="13" fill="#747585">nome <tspan fill="#9b9baa">VARCHAR(80)</tspan></text>
    <line x1="397" y1="286" x2="603" y2="286" stroke="#f0f0f4"/>
    <text x="397" y="313" font-family="Arial,sans-serif" font-size="13" fill="#747585">regiao <tspan fill="#9b9baa">VARCHAR(60)</tspan></text>
    <line x1="397" y1="328" x2="603" y2="328" stroke="#f0f0f4"/>
    <text x="397" y="355" font-family="Arial,sans-serif" font-size="13" fill="#747585">insignias <tspan fill="#9b9baa">TINYINT</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="751" y="144" width="250" height="289" rx="14" fill="#fff" stroke="#ececf1"/>
    <rect x="751" y="144" width="250" height="52" rx="14" fill="#747df6"/>
    <path d="M751 180h250v16H751z" fill="#747df6"/>
    <text x="773" y="177" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">POKEMONS</text>
    <text x="773" y="224" font-family="Arial,sans-serif" font-size="13" fill="#747585">id <tspan fill="#ec5362" font-weight="700">PK</tspan></text>
    <line x1="773" y1="237" x2="979" y2="237" stroke="#f0f0f4"/>
    <text x="773" y="260" font-family="Arial,sans-serif" font-size="13" fill="#747585">treinador_id <tspan fill="#747df6" font-weight="700">FK</tspan></text>
    <line x1="773" y1="273" x2="979" y2="273" stroke="#f0f0f4"/>
    <text x="773" y="296" font-family="Arial,sans-serif" font-size="13" fill="#747585">nome · especie · tipo</text>
    <line x1="773" y1="309" x2="979" y2="309" stroke="#f0f0f4"/>
    <text x="773" y="332" font-family="Arial,sans-serif" font-size="13" fill="#747585">nivel <tspan fill="#9b9baa">TINYINT (1–100)</tspan></text>
    <rect x="773" y="356" width="206" height="42" rx="8" fill="#f1f1ff"/>
    <text x="788" y="382" font-family="Arial,sans-serif" font-size="11" fill="#7377c5">Cada Pokémon tem 1 treinador</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="751" y="474" width="250" height="94" rx="14" fill="#fff" stroke="#ececf1"/>
    <rect x="751" y="474" width="250" height="42" rx="14" fill="#ffd66c"/>
    <path d="M751 500h250v16H751z" fill="#ffd66c"/>
    <text x="773" y="502" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#292a37">BATALHAS</text>
    <text x="773" y="541" font-family="Arial,sans-serif" font-size="12" fill="#747585">id <tspan fill="#ec5362" font-weight="700">PK</tspan>  ·  pokemon_id <tspan fill="#747df6" font-weight="700">FK</tspan>  ·  data_batalha</text>
  </g>

  <path d="M625 270 H735" fill="none" stroke="#747df6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="643" y="254" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#747df6">1 : N</text>
  <text x="635" y="293" font-family="Arial,sans-serif" font-size="10" fill="#9394a3">treina</text>
  <path d="M876 433 V463" fill="none" stroke="#747df6" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="889" y="455" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#747df6">1 : N</text>

  <text x="54" y="528" font-family="Arial,sans-serif" font-size="11" fill="#9293a1">PK = chave primária</text>
  <text x="54" y="547" font-family="Arial,sans-serif" font-size="11" fill="#9293a1">FK = chave estrangeira</text>
  <text x="54" y="566" font-family="Arial,sans-serif" font-size="11" fill="#9293a1">usuarios não se relaciona com treinadores, pokemons ou batalhas.</text>
</svg>
